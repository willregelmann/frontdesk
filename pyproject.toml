[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "frontdesk"
version = "0.1.0"
description = "A front desk for agents and people: reach anyone listed in the conversation they are actually in."
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<1"]

[project.optional-dependencies]
claude-code = ["mcp>=1.20,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "mcp>=1.20,<2"]

[project.scripts]
frontdesk = "frontdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
